{% extends 'base.html' %}
{% block title %}{{ page_title }} | Student Portal{% endblock %}
{% block content %}
<section class="tool-page">
    <p class="eyebrow">{{ eyebrow }}</p>
    <h1>{{ page_title }}</h1>
    <p class="tool-intro">{{ intro }}</p>
    <div class="tool-list">
        {% for item in items %}<div class="tool-item"><span class="check-mark">&#10003;</span><span>{{ item }}</span></div>{% endfor %}
    </div>
    <a class="button button-primary" href="{% url 'dashboard' %}">&larr; Back to dashboard</a>
</section>
{% endblock %}
