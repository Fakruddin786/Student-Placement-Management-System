{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<section class="auth-panel">
	<div class="auth-intro">
		<p class="eyebrow">ACCOUNT SECURITY</p>
		<h1>{{ page_title }}</h1>
		<p>{{ status_message }}</p>
	</div>
	<p class="auth-footer"><a class="button button-primary" href="{% url action_url_name %}">{{ action_label }}</a></p>
</section>
{% endblock %}
