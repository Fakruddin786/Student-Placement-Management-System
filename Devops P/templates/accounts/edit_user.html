{% extends 'base.html' %}
{% block title %}Edit user{% endblock %}
{% block content %}
<section class="admin-edit-page">
    <div class="admin-edit-header">
        <p class="eyebrow">ADMIN PORTAL</p>
        <h1>Edit {{ managed_user.email }}</h1>
    </div>

    <form method="post" class="admin-edit-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-success" type="submit">Save changes</button>
    </form>
</section>
{% endblock %}
