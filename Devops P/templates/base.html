<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Portal{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">A</span> Admin</a>
        <div class="nav-links">
            {% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a>{% endif %}
        {% if user.is_authenticated %}
            <span class="user-chip">{{ user.email }}</span>
            <a href="{% url 'password_change' %}">Change password</a>
            <form method="post" action="{% url 'logout' %}" class="inline-form">{% csrf_token %}<button class="button button-ghost" type="submit">Log out</button></form>
        {% else %}
            <a class="button button-ghost" href="{% url 'login' %}">Log in</a>
            <a class="button button-primary" href="{% url 'register' %}">Register</a>
        {% endif %}
        </div>
    </nav>
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    <main class="page-shell">{% block content %}{% endblock %}</main>
</body>
</html>
