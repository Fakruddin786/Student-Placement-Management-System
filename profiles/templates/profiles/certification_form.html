{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'profiles/styles.css' %}">
</head>
<body class="page-shell">
    <div class="card">
        <h2>{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <ul class="errorlist">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="form-actions">
                <button type="submit">Save</button>
                <a href="{% url cancel_url %}" class="secondary-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
