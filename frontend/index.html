<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Management System</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <header class="header">
    <h1>Interview Management System</h1>
    <p>Student Interview & Placement Portal</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>Interview Schedule</h2>

      <div class="form-row">
        <input
          type="text"
          id="studentId"
          placeholder="Enter Student ID"
        />

        <button onclick="loadInterviews()">
          View Schedule
        </button>
      </div>

      <div id="interviewMessage"></div>

      <table id="interviewTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Round</th>
            <th>Mode</th>
            <th>Venue</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="interviewBody">
        </tbody>
      </table>
    </section>


    <section class="card">
      <h2>Placement History</h2>

      <div class="form-row">
        <input
          type="text"
          id="placementStudentId"
          placeholder="Enter Student ID"
        />

        <button onclick="loadPlacements()">
          View Placements
        </button>
      </div>

      <div id="placementMessage"></div>

      <table id="placementTable">
        <thead>
          <tr>
            <th>Company</th>
            <th>Job Role</th>
            <th>Package</th>
            <th>Placement Date</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="placementBody">
        </tbody>
      </table>
    </section>

  </main>

  <script src="js/app.js"></script>

</body>
</html>
